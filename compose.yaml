services:
  postgres:
    image: postgres:18
    container_name: zstack-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: zstack
      POSTGRES_PASSWORD: zstack
      POSTGRES_DB: zstack
    volumes:
      - zstack_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zstack -d zstack"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  zstack_pg_data:
