name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".github/workflows/docs.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Also compiles Paraglide via @zstack/i18n `prepare`.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Test
        run: pnpm test

      # workerd pool smoke. Hyperdrive only needs a connection string, not a live DB.
      - name: Test (workers pool)
        run: pnpm test:workers

      # api wrangler dry-run bundle + web/admin vite builds.
      - name: Build
        run: pnpm build

      # drizzle-kit reads DATABASE_URL from the committed .env.development but
      # neither command connects to Postgres.
      - name: Drizzle migrations consistent
        run: pnpm --filter @zstack/api exec drizzle-kit check

      - name: Drizzle schema has no ungenerated migration
        run: |
          pnpm --filter @zstack/api exec drizzle-kit generate
          if [ -n "$(git status --porcelain apps/api/drizzle)" ]; then
            git status --porcelain apps/api/drizzle
            echo "::error::schema.ts changed without a migration. Run 'pnpm db:generate' and commit apps/api/drizzle."
            exit 1
          fi
