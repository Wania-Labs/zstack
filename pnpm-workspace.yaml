packages:
  - "apps/*"
  - "packages/*"
  - "create-zstack"

allowBuilds:
  esbuild: true
  workerd: true
  msgpackr-extract: false
  # skip install/check.js; a system libvips makes sharp compile and fail
  sharp: false
  "@sentry/cli": true

minimumReleaseAgeExclude:
  - pg-protocol@1.16.0
  - pg@8.23.0
  - evlog@2.25.0
  - "@effect/platform-node-shared@4.0.0-rc.108"
  - "@effect/platform-node@4.0.0-rc.108"
  - "@effect/sql-pg@4.0.0-rc.108"
  - "@effect/vitest@4.0.0-rc.108"
  - effect@4.0.0-rc.108
  - alchemy@2.0.0-beta.72
  - drizzle-orm@1.0.0-rc.5-ab785fc
  - drizzle-kit@1.0.0-rc.5-ab785fc
